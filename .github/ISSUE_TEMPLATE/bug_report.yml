name: "버그 신고"
description: "패처 실행, 패치 생성·적용, 번역 또는 화면 표시에 문제가 있을 때 작성해주세요."
title: "[버그] 예: 전체 패치 생성 중 오류가 발생합니다"
labels:
  - "bug"
body:
  - type: markdown
    attributes:
      value: |
        제보해주셔서 감사합니다.

        위 제목의 `예:` 문구를 지우고 **어디에서 무엇이 잘못됐는지** 한 줄로 바꿔주세요.
        좋은 제목 예시: `[버그] 전체 패치 생성 중 0a0000 index 오류가 발생합니다`

  - type: checkboxes
    id: existing_issue
    attributes:
      label: "기존 이슈 확인"
      description: "같은 문제가 이미 등록되어 있는지 먼저 검색해주세요."
      options:
        - label: "열린 이슈와 닫힌 이슈에서 같은 문제를 검색했습니다."
          required: true

  - type: dropdown
    id: problem_area
    attributes:
      label: "문제가 발생한 기능"
      description: "가장 가까운 항목을 선택해주세요."
      options:
        - "패처 실행 또는 사전 점검"
        - "전체 한글 패치"
        - "폰트만 패치"
        - "패치 제거 또는 백업 복구"
        - "번역 또는 문구"
        - "글꼴 또는 화면 표시"
        - "기타"
    validations:
      required: true

  - type: input
    id: patcher_version
    attributes:
      label: "사용한 패처 버전"
      description: "다운로드한 GitHub Release 태그를 적어주세요. 최신 버전은 Releases 페이지에서 확인할 수 있습니다."
      placeholder: "예: v2026.08.29.2254"
    validations:
      required: true

  - type: dropdown
    id: base_language
    attributes:
      label: "베이스 클라이언트 언어"
      options:
        - "일본어 (ja)"
        - "영어 (en)"
        - "잘 모르겠습니다"
    validations:
      required: true

  - type: dropdown
    id: version_match
    attributes:
      label: "글로벌/한국 클라이언트 버전 일치 여부"
      description: "두 클라이언트의 ffxivgame.ver가 같은지 선택해주세요."
      options:
        - "같음"
        - "다름"
        - "확인하지 못함"
    validations:
      required: true

  - type: textarea
    id: current_behavior
    attributes:
      label: "어떤 문제가 발생했나요?"
      description: "화면에 보인 문구, 깨진 위치, 오류 메시지 등 실제 결과를 구체적으로 적어주세요."
      placeholder: |
        예: 전체 한글 패치를 누르면 30%에서 중단되고, 결과 창에 '...' 오류가 표시됩니다.
    validations:
      required: true

  - type: textarea
    id: reproduction_steps
    attributes:
      label: "재현 방법"
      description: "처음 보는 사람도 같은 문제를 재현할 수 있도록 순서대로 적어주세요."
      placeholder: |
        1. 패처를 관리자 권한으로 실행합니다.
        2. 일본어 클라이언트를 선택합니다.
        3. 전체 한글 패치를 누릅니다.
        4. ...에서 문제가 발생합니다.
    validations:
      required: true

  - type: textarea
    id: expected_behavior
    attributes:
      label: "원래 어떻게 동작해야 하나요?"
      placeholder: "예: 패치가 완료되고 해당 문구가 한국어로 표시되어야 합니다."
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: "패치 로그와 진단 파일"
      description: |
        `Win + R`을 누르고 `%LOCALAPPDATA%\FFXIVKoreanPatch`를 입력하면 관련 폴더가 열립니다.
        가능하면 아래 두 파일을 이 영역에 끌어다 놓아주세요.
        - `logs\*-build-release.log`
        - `generated-release\<언어>\<게임 버전>\<생성 시각>\patch-diagnostics.tsv`
        로그에 포함된 Windows 사용자 이름 등 개인정보는 가려주세요.
      placeholder: "패치 생성·적용 로그와 patch-diagnostics.tsv를 이 영역에 끌어다 놓아주세요."

  - type: textarea
    id: crash_data
    attributes:
      label: "클라이언트 크래시 자료"
      description: |
        FFXIV가 종료됐다면 가능할 때 `Win + R`에서 `%ProgramData%\Microsoft\Windows\WER\ReportArchive`를 열고 `AppCrash_ffxiv_dx11.exe_*` 폴더를 찾아주세요.
        폴더가 없으면 이벤트 뷰어의 `Windows 로그 > 응용 프로그램`에서 `ffxiv_dx11.exe`의 Application Error 또는 Windows Error Reporting 내용을 붙여주세요.
        전체 `.dmp` 파일은 계정·세션 등 민감한 메모리를 포함할 수 있으므로 공개 이슈에 직접 첨부하지 말고, 존재 여부와 파일 크기만 적어주세요.
      placeholder: |
        WER 폴더: AppCrash_ffxiv_dx11.exe_...
        예외 코드:
        오류 모듈:
        오류 오프셋:

  - type: textarea
    id: screenshots
    attributes:
      label: "스크린샷 또는 추가 자료"
      description: "화면 표시 문제라면 스크린샷을 끌어다 놓아주세요. 캐릭터명 등 개인정보는 가려주세요."

  - type: checkboxes
    id: final_check
    attributes:
      label: "마지막 확인"
      options:
        - label: "제목의 예시 문구를 실제 문제를 설명하는 제목으로 바꿨습니다."
          required: true
        - label: "첨부 자료에서 계정명, 캐릭터명, Windows 사용자 이름 등 개인정보를 확인했습니다."
          required: true
